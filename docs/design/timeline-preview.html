<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声剪 · 剪辑台设计预览</title>
<style>
:root{color-scheme:light;--bg:#f4f1ea;--surface:#fffdf8;--ink:#292631;--muted:#625b68;--line:#ded7d1;--accent:#af9dff;--apricot:#fdbf92;--wave:#625583;--selection:#e9e1ff;--soft:#eee8e0;--alert:#8e3e29;font-family:"Instrument Sans","Microsoft YaHei","PingFang SC",sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1622;--surface:#152836;--ink:#f9faf3;--muted:#afbec8;--line:#40525f;--wave:#c4b7f6;--selection:#463a65;--soft:#233847;--alert:#ffc5a9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,summary{font:inherit}button,summary{cursor:pointer}button{min-height:48px;padding:0 15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);white-space:nowrap;font-weight:600}button:disabled{opacity:.48;cursor:default}button:hover:not(:disabled){border-color:var(--wave)}:focus-visible{outline:3px solid var(--wave);outline-offset:3px}button.primary{background:var(--accent);color:#211935;border-color:#a693f1}.quiet{background:transparent}.danger{color:var(--alert)}.mono,time,input,output{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--line);padding:12px clamp(16px,4vw,56px);display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:#211935;border-radius:9px;font:700 20px Consolas}.brand{font-weight:750}.draft{color:var(--muted);font-size:13px;margin-inline-end:auto}
main{max-width:1280px;margin:auto;padding:clamp(20px,4vw,56px) clamp(16px,4vw,50px) 28px}.project{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:24px}.project h1{font-size:clamp(25px,4vw,38px);line-height:1.2;margin:0 0 8px;letter-spacing:-.04em}.project p,.hint,.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.project p{overflow-wrap:anywhere}.tools,.transport,.edit{display:flex;gap:8px;flex-wrap:wrap}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,31%);border:1px solid var(--line);background:var(--surface);border-radius:14px}.track{min-width:0;padding:22px}.inspector{border-left:1px solid var(--line);padding:22px;min-width:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h2{font-size:17px;margin:0}.position{font-size:clamp(16px,3vw,23px);font-weight:650}.position-label{display:block;font-size:11px;color:var(--muted)}
.plot{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}.ruler{display:flex;justify-content:space-between;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.lane{position:relative}.lane + .lane{border-top:1px solid var(--line)}canvas{display:block;width:100%;height:92px;touch-action:pan-y;cursor:crosshair}.channel{position:absolute;top:8px;left:9px;font-size:11px;font-weight:650;color:var(--muted);pointer-events:none}.transport{margin-top:16px}.transport button{flex:1}.hint{margin-top:11px}
.fields{display:grid;gap:12px;margin:16px 0}.fields label{display:grid;gap:5px;font-size:13px;color:var(--muted)}input{min-height:48px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}.duration{display:flex;justify-content:space-between;gap:10px;border-block:1px solid var(--line);padding:10px 0;margin-bottom:14px;font-size:13px}.edit button{flex:1}.status{min-height:1.55em;margin:11px 0 0;color:var(--muted);font-size:13px}.status.error{color:var(--alert)}
.secondary{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}summary{min-height:48px;padding:13px 16px;font-weight:650}details section{border-top:1px solid var(--line);padding:14px 16px}.check{min-height:48px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.check input{width:19px;height:19px;min-height:0;accent-color:var(--wave)}
@media(max-width:680px){main{padding-top:20px}.project{align-items:start}.project h1{letter-spacing:-.025em}.workspace{grid-template-columns:1fr}.inspector{border-left:0;border-top:1px solid var(--line)}.track,.inspector{padding:14px}.fields{grid-template-columns:1fr 1fr}.position{font-size:17px}canvas{height:66px}.transport{display:grid;grid-template-columns:1fr 1fr}.tools{gap:5px}.tools button{padding:0 10px}.ruler span:nth-child(even){display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
[hidden]{display:none!important}
main{max-width:820px}.workspace{display:flex;flex-direction:column;gap:12px;border:0;background:none}.workspace>section{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
.fields{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fields label{line-height:1.35}.duration{margin-bottom:0}.edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.transport{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.segments{display:flex;min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}.segments button{min-width:0;padding:0 2px;border:0;border-radius:0;background:var(--selection);overflow:hidden;text-overflow:ellipsis;font-size:12px}.segments button+button{border-left:2px solid var(--surface)}.edit-ruler{border:0;padding-inline:0}.feedback{display:flex;align-items:center;justify-content:space-between;gap:8px}.status:empty{min-height:0;margin:0}
@media(max-width:430px){.fields label{font-size:12px}.fields input{padding-inline:7px}.project h1{font-size:24px}.workspace>section{padding:12px}}
</style>
<header><span class="mark" aria-hidden="true">∿</span><span class="brand">声剪</span><span class="draft">剪辑台设计预览</span><button type="button" class="quiet" id="theme" aria-pressed="false">深色</button></header>
<main>
  <div class="project">
    <div><h1>音频剪辑台</h1><p>立体声测试项目 · stereo-48k.wav · 48 kHz</p></div>
    <button type="button" class="quiet" id="export">导出 WAV</button>
  </div>
  <div class="workspace">
    <section class="track" aria-labelledby="track-title">
      <div class="section-head"><h2 id="track-title">音频波形与选区</h2><div><span class="position-label">播放位置</span><output class="position" id="position" aria-live="off">00:00.500</output></div></div>
      <div class="plot" role="img" aria-label="左右声道采样波形。可在当前选区输入起止时间。">
        <div class="ruler" aria-hidden="true"><span>00:00.000</span><span>00:00.500</span><span>00:01.000</span><span>00:01.500</span><span>00:02.000</span></div>
        <div class="lane"><canvas></canvas><span class="channel">左声道</span></div>
        <div class="lane"><canvas></canvas><span class="channel">右声道</span></div>
      </div>
    </section>
    <section class="inspector" aria-labelledby="range-title">
      <div class="section-head"><h2 id="range-title">当前选区</h2><label class="check"><input type="checkbox" id="snap" checked>吸附 0.1 秒</label></div>
      <div class="fields">
        <label>开始时间（秒）<input id="from" type="number" min="0" max="2" step="any" value="0.5" inputmode="decimal"></label>
        <label>结束时间（秒）<input id="to" type="number" min="0" max="2" step="any" value="1" inputmode="decimal"></label>
        <label>淡入（秒）<input id="fade" type="number" min="0" max="2" step="any" value="0" inputmode="decimal"></label>
      </div>
      <div class="duration"><span>选区 <output id="span"></output></span><span>剪后 <output id="length"></output></span></div>
    </section>
    <section class="track" aria-labelledby="tools-title">
      <div class="section-head"><h2 id="tools-title">剪辑工具</h2></div>
      <div class="edit"><button id="trim" class="primary">修剪</button><button id="split">分割</button><button id="remove" class="danger">删除</button><button id="keep">保留</button><button id="undo" disabled>撤销</button><button id="listen" aria-expanded="false" aria-controls="transport">试听</button></div>
      <div class="transport" id="transport" hidden><button id="source">试听原音</button><button id="selection">试听选区</button><button id="preview">试听剪后</button><button id="stop" disabled>停止</button></div>
      <div class="feedback"><p class="status" id="status" role="status"></p><button class="quiet" id="redo" hidden disabled>重做</button></div>
    </section>
    <section class="track" aria-labelledby="edit-track-title">
      <div class="section-head"><h2 id="edit-track-title">编辑轨道</h2></div>
      <div class="segments" id="segments" aria-label="剪后片段"></div>
      <div class="ruler edit-ruler" id="edit-ruler" aria-hidden="true"></div>
    </section>
  </div>
</main>

    ctx.beginPath();

      ctx.moveTo(width * i / 4, 0);
      ctx.lineTo(width * i / 4, height);
    }
    ctx.moveTo(0, height / 2);
    ctx.lineTo(width, height / 2);
    ctx.stroke();
    ctx.strokeStyle = palette.wave;
    ctx.beginPath();
    for (let pixel = 0; pixel < width; pixel++) {
      const start = Math.floor(pixel * frames / width);
      const end = Math.min(frames, Math.ceil((pixel + 1) * frames / width));
      let low = 0;
      let high = 0;
      for (let frame = start; frame < end; frame++) {
        const value = pcm[frame * 2 + channel];
        low = Math.min(low, value);
        high = Math.max(high, value);
      }
      ctx.moveTo(pixel + .5, height / 2 - high / 32768 * height * .48);
      ctx.lineTo(pixel + .5, height / 2 - low / 32768 * height * .48 + 1);
    }
    ctx.stroke();
    const shade = (start, end) => {
      if (end <= start) return;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x(start), 0, x(end - start), height);
      ctx.clip();
      ctx.strokeStyle = palette.line;
      ctx.beginPath();
      for (let line = x(start) - height; line < x(end); line += 8) {
        ctx.moveTo(line, height);
        ctx.lineTo(line + height, 0);
      }
      ctx.stroke();
      ctx.restore();
    };
    let last = 0;
    for (const [start, end] of kept()) {
      shade(last, start);
      last = end;
    }
    shade(last, frames);
    ctx.fillStyle = '#fdbf92';
    ctx.fillRect(clip(x(position) - 1, 0, width - 2), 0, 2, height);
  });
}
function sync() {
  fields.forEach((field, index) => { field.value = Number((selected[index] / sampleRate).toFixed(6)); });
  byId('span').textContent = ms(selected[1] - selected[0]) + ' ms';
  byId('length').textContent = (kept().reduce((n, [s, e]) => n + e - s, 0) / sampleRate).toFixed(3) + ' s';
  byId('undo').disabled = revision === 0;
  byId('redo').disabled = revision === history.length - 1;
  byId('redo').hidden = byId('redo').disabled;
  const total = kept().reduce((n, [start, end]) => n + end - start, 0);
  const segments = kept().map(([start, end], index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.style.flex = String(end - start);
    button.textContent = '片段 ' + (index + 1);
    button.setAttribute('aria-label', '定位源区间 ' + seconds(start) + ' 至 ' + seconds(end) + ' 秒');
    button.onclick = () => { stop(); selectRange(start, end); };
    return button;
  });
  byId('segments').replaceChildren(...segments);
  byId('edit-ruler').replaceChildren(...[0, .25, .5, .75, 1].map(fraction => {
    const label = document.createElement('span');
    label.textContent = stamp(total * fraction);
    return label;
  }));
  redraw();
}
function selectRange(start, end) {
  selected = [start, end];
  position = start;
  notice();
  sync();
}
function readRange() {
  const [start, end] = fields.map(field => field.valueAsNumber);
  if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end > frames / sampleRate ||
      Math.round(start * sampleRate) >= Math.round(end * sampleRate)) {
    notice('请输入 0–2 秒内有效的起止时间。', true);
    return false;
  }
  const next = [Math.round(start * sampleRate), Math.round(end * sampleRate)];
  if (next.some((value, index) => value !== selected[index])) selectRange(...next);
  return true;
}
fields.forEach(field => field.addEventListener('change', readRange));
for (const canvas of canvases) {
  const at = event => {
    const rect = canvas.getBoundingClientRect();
    const frame = clip((event.clientX - rect.left) / rect.width * frames, 0, frames);
    const step = byId('snap').checked ? 4800 : 1;
    return Math.round(frame / step) * step;
  };
  canvas.onpointerdown = event => {
    if (event.button !== 0) return;
    stop();
    canvas.setPointerCapture(event.pointerId);
    drag = { start: at(event), before: selected };
    position = drag.start;
    redraw();
  };
  canvas.onpointermove = event => {
    if (!drag || !canvas.hasPointerCapture(event.pointerId)) return;
    const next = at(event);
    if (drag.start !== next) selectRange(Math.min(drag.start, next), Math.max(drag.start, next));
  };
  canvas.onpointerup = () => { drag = undefined; };
  canvas.onpointercancel = () => {
    if (drag) selectRange(...drag.before);
    drag = undefined;
  };
}
function edit(retain) {
  if (!readRange()) return;
  const [start, end] = selected;
  const next = kept().flatMap(([s, e]) => retain
    ? [[Math.max(s, start), Math.min(e, end)]]
    : [[s, Math.min(e, start)], [Math.max(s, end), e]]).filter(([s, e]) => s < e);
  if (!next.length) return notice('这项编辑会移除全部音频。请调整选区。', true);
  if (JSON.stringify(next) === JSON.stringify(kept())) return notice('剪后区间没有变化。');
  stop();
  history.splice(++revision, history.length, next);
  sync();
  notice(retain ? '已保留选区。' : '已删除选区。可撤销。');
}
byId('trim').onclick = () => edit(true);
byId('split').onclick = () => {
  if (!readRange()) return;
  const cut = position;
  if (!kept().some(([start, end]) => start < cut && cut < end)) {
    notice('请先把播放头移到保留片段内。', true);
    return;
  }
  const next = kept().flatMap(([start, end]) =>
    start < cut && cut < end ? [[start, cut], [cut, end]] : [[start, end]]);
  stop();
  history.splice(++revision, history.length, next);
  sync();
  notice('已在播放位置分割。');
};
byId('listen').onclick = () => {
  const panel = byId('transport');
  panel.hidden = !panel.hidden;
  byId('listen').setAttribute('aria-expanded', String(!panel.hidden));
};
byId('remove').onclick = () => edit(false);
byId('keep').onclick = () => edit(true);
byId('undo').onclick = () => { stop(); revision--; sync(); notice('已撤销。'); };
byId('redo').onclick = () => { stop(); revision++; sync(); notice('已重做。'); };
function waveFile(ranges, fadeFrames = 0) {
  const length = ranges.reduce((n, [s, e]) => n + (e - s) * 4, 0);
  const header = raw.slice(0, 44);
  const view = new DataView(header.buffer);
  view.setUint32(4, length + 36, true);
  view.setUint32(40, length, true);
  let written = 0;
  const chunks = ranges.map(([start, end]) => {
    const data = raw.subarray(44 + start * 4, 44 + end * 4);
    const ramp = Math.min(end - start, Math.max(0, fadeFrames - written));
    const output = ramp > 0 ? data.slice() : data;
    const samples = new DataView(output.buffer, output.byteOffset, output.byteLength);
    for (let frame = 0; frame < ramp; frame++) {
      for (const channel of [0, 2]) {
        const offset = frame * 4 + channel;
        samples.setInt16(offset, Math.round(samples.getInt16(offset, true) * (written + frame) / fadeFrames), true);
      }
    }
    written += end - start;
    return output;
  });
  return new Blob([header, ...chunks], { type: 'audio/wav' });
}
function stop() {
  if (!playback) return;
  audio.pause();
  cancelAnimationFrame(playback.animation);
  URL.revokeObjectURL(playback.url);
  playback = undefined;
  byId('stop').disabled = true;
}
function fadeLength(ranges) {
  const value = byId('fade').valueAsNumber;
  const frames = ranges.reduce((total, [start, end]) => total + end - start, 0);
  if (!Number.isFinite(value) || value < 0 || value > frames / sampleRate) {
    notice('淡入时间须在 0 秒与试听或导出的音频时长之间。', true);
    return undefined;
  }
  return Math.round(value * sampleRate);
}
async function play(ranges, fadeFrames = 0) {
  stop();
  const active = { url: URL.createObjectURL(waveFile(ranges, fadeFrames)), animation: 0 };
  playback = active;
  audio.src = active.url;
  byId('stop').disabled = false;
  try {
    await audio.play();
  } catch {
    if (playback === active) { stop(); notice('试听启动失败。请重试。', true); }
    return;
  }
  function tick() {
    if (playback !== active) return;
    let remaining = Math.round(audio.currentTime * sampleRate);
    for (const [start, end] of ranges) {
      position = start + Math.min(remaining, end - start);
      if (remaining < end - start) break;
      remaining -= end - start;
    }
    redraw();
    active.animation = requestAnimationFrame(tick);
  }
  tick();
}
audio.onended = stop;
byId('source').onclick = () => play([[0, frames]]);
byId('selection').onclick = () => { if (readRange()) play([selected]); };
byId('preview').onclick = () => {
  const fadeFrames = fadeLength(kept());
  if (fadeFrames !== undefined) play(kept(), fadeFrames);
};
byId('stop').onclick = stop;
byId('export').onclick = () => {
  const fadeFrames = fadeLength(kept());
  if (fadeFrames === undefined) return;
  const link = document.createElement('a');
  link.href = URL.createObjectURL(waveFile(kept(), fadeFrames));
  link.download = 'voxcarve-preview.wav';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 3000);
};
function colors() {
  const css = getComputedStyle(document.documentElement);
  palette = Object.fromEntries(['selection', 'line', 'wave'].map(key => [key, css.getPropertyValue('--' + key).trim()]));
}
byId('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  byId('theme').textContent = dark ? '浅色' : '深色';
  byId('theme').setAttribute('aria-pressed', String(dark));
  colors();
  redraw();
};
colors();
new ResizeObserver(redraw).observe(canvases[0]);
sync();
</script>
